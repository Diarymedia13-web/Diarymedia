name: Build & Deploy to Hostinger

# Mỗi lần push lên nhánh main: build site tĩnh rồi đẩy qua FTP vào public_html.
# Có thể bấm chạy tay từ tab Actions trên GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cài dependencies
        run: npm ci

      - name: Build site tĩnh
        env:
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run build

      # Next.js không tự copy file ẩn từ public/, nên chép .htaccess thủ công.
      - name: Chép .htaccess vào bản build
        run: cp public/.htaccess out/.htaccess

      - name: Đẩy lên Hostinger qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
